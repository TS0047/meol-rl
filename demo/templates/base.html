<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MEOL Air Combat Demo{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --ink2: #4b5563; --muted: #8a93a0; --line: #e3e6ea;
    --blue: #2a78d6; --red: #e0533a; --green: #1baf7a; --amber: #eda100; --grey: #7f7f7f; --violet: #9b59b6;
    --accent: #2a78d6; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --ink: #e8ebef; --ink2: #b5bcc6; --muted: #7d8692; --line: #2a3038; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  header.top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex;
               align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header.top h1 { font-size: 18px; margin: 0; } header.top span { color: var(--muted); font-size: 13px; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 16px; margin: 0 0 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .pilots { display: grid; gap: 8px; }
  .pilot { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .pilot:hover { border-color: var(--muted); }
  .pilot input { margin-top: 4px; }
  .pilot b { display: block; } .pilot small { color: var(--ink2); } .pilot .rec { color: var(--muted); font-size: 12px; }
  .own .pilot:has(input:checked) { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
  .adv .pilot:has(input:checked) { border-color: var(--red); box-shadow: inset 3px 0 0 var(--red); }
  .side-title { font-weight: 600; margin-bottom: 8px; } .side-title.own { color: var(--blue); } .side-title.adv { color: var(--red); }
  label.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--ink2); }
  label.field .row { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  input[type=number], input[type=text], select { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 7px 9px; font: inherit; width: 110px; }
  select { width: 100%; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .checks label { display: block; margin: 6px 0; font-size: 14px; }
  button, .btn { background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 10px 18px; font: inherit;
      font-weight: 600; cursor: pointer; display: inline-block; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; color: #fff; }
  .o-win { background: var(--blue); } .o-loss { background: var(--red); } .o-timeout { background: var(--grey); }
  .o-crash { background: var(--amber); } .o-disengaged { background: var(--violet); } .o-adversary_crash { background: var(--green); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .kpi .v { font-size: 24px; font-weight: 700; } .kpi .l { color: var(--muted); font-size: 12px; }
  img.fig { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  img.thumb { width: 140px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  code { background: var(--line); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .scroll { overflow-x: auto; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top"><h1><a href="{{ url_for('index') }}" style="color:inherit">MEOL Air Combat Demo</a></h1>
<span>JSBSim F-16 1v1 gun fights · Li et al., Drones 2025 reproduction</span></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
